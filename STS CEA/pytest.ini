[pytest]
testpaths = tests
markers =
    e2e: browser-based end-to-end tests
    api: backend API tests (no browser)
    mock: tests that fake network responses
    positive: happy-path test
    negative: error / invalid-input test
addopts = --base-url http://localhost:5173 --screenshot only-on-failure --tracing retain-on-failure --reruns 2 --reruns-delay 2 --output test-results --html=reports/report.html --self-contained-html -v
